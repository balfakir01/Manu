name: Build APK

on:
  push:
    branches: [main]      # PR branches are built by the pull_request event; don't build them twice
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          # Save downloaded dependencies from PR branches too, so later builds don't
          # re-download everything from Maven Central (which rate-limits CI runners).
          cache-read-only: false

      - name: Build APK
        # Retry rate-limited (HTTP 429) downloads patiently instead of failing on the first one.
        run: >-
          ./gradlew --no-daemon assembleDebug
          -Dorg.gradle.internal.repository.max.retries=8
          -Dorg.gradle.internal.repository.initial.backoff=2000

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DataGuard-apk
          path: app/build/outputs/apk/debug/app-debug.apk
